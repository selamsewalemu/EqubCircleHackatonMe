services:
  postgres:
    image: postgres:16
    container_name: ekubcircle-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ekubcircle
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
    ports:
      - "5432:5432"
    volumes:
      - ekubcircle_pgdata:/var/lib/postgresql/data

volumes:
  ekubcircle_pgdata:
